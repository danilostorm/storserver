name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Build StorServer images
        run: docker compose build
      - name: Run backend integration tests
        run: docker compose run --rm -e PYTHONPATH=/app -v "$PWD/backend/tests:/app/tests:ro" backend pytest -q
